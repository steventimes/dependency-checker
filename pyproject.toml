[project]
name = "depcheck"
version = "0.2.0"
description = "Detect unused dependencies and security vulnerabilities in Python projects."
requires-python = ">=3.11"
authors = [{ name = "Steven Yang", email = "stevenyang0316@gmail.com" }]

dependencies = [
    "requests",
    "tomli; python_version < '3.11'",
]

[project.scripts]
depcheck = "depcheck.cli.__main__:main"
