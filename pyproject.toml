[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "depcheck"
version = "0.4.0"
description = "Static multi-ecosystem dependency evidence, security, and SBOM scanner."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Steven Yang", email = "stevenyang0316@gmail.com" }]
keywords = ["dependencies", "security", "osv", "sarif", "sbom", "multi-ecosystem"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
dependencies = [
    "packaging>=23.2",
    "PyYAML>=6.0.2,<7",
    "requests>=2.31",
    "tomlkit>=0.13,<1",
]

[project.optional-dependencies]
agent = [
    "mcp>=1.28,<2",
]
test = [
    "build>=1.2,<2",
    "mcp>=1.28,<2",
    "mypy>=1.10,<2",
    "pytest>=9.0.3,<10",
    "ruff>=0.6,<1",
    "setuptools==83.0.0",
    "types-PyYAML>=6,<7",
    "uv==0.12.4",
]

[tool.uv]
required-version = "==0.12.4"
build-constraint-dependencies = ["setuptools==83.0.0"]
constraint-dependencies = ["PyJWT>=2.15.0", "urllib3>=2.8.0"]

[project.scripts]
depcheck = "depcheck.command:cli"
depcheck-mcp = "depcheck.agent.mcp_server:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["depcheck*"]
exclude = ["test*"]

[tool.ruff]
target-version = "py311"
line-length = 88
cache-dir = ".tmp/ruff-cache"

[tool.pytest.ini_options]
cache_dir = ".tmp/pytest-cache"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
cache_dir = ".tmp/mypy-cache"
files = ["depcheck"]
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
no_implicit_optional = true
warn_unreachable = true
